dependencies:
  idf:
    version: '>=5.5'
  espressif/cjson: '~1.7'
  lvgl/lvgl:
    version: '9.5.0'
    public: true
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} != "none"'
  espressif/esp_codec_dev:
    version: '~1.5'
    public: true
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} != "none"'
  espressif/esp_lvgl_adapter:
    version: '0.6.4'
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} in ["ostb_echoear_2st", "waveshare_s3_175c", "waveshare_s3_175", "waveshare_s3_216", "waveshare_s3_185c", "aipi", "m5stack_cardputer_adv", "sensecap_watcher", "m5stack_sticks3", "m5stack_stickc_plus2", "m5stack_stopwatch", "fnk0104b", "vn_s3_183", "ai_passport", "waveshare_s3_lcd128", "esp_mosaico"]'
  waveshare/esp32_s3_touch_amoled_1_75c:
    version: '^3.0.0'
    rules:
      - if: '$CONFIG{MUSE_BOARD_ID} == "waveshare_s3_175c"'
